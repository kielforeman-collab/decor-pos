{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "decor-pos.postgres.fullname" . }}
  labels:
    {{- include "decor-pos.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: decor-pos
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
