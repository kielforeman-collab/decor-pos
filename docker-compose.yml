# decor-pos self-hosted stack (v1.2) — `docker compose up`
#
# Services:
#   postgres — PostgreSQL 16, the HQ database in v1.2. `df-server hq`
#     connects to it (see docs/self-hosting.md for the HQ command);
#     this stack does not run an `hq` service yet — the edge + api
#     below are the working path.
#   edge     — the store daemon (`df-server edge`, SQLite). This is
#     the working path: counter POS, portal, BOPIS, sync outbox.
#   api      — the HQ read API (`df-api`) against the SAME SQLite
#     file the edge owns (shared volume). Admin reads only.
#
# SECURITY (read docs/security-review-v1.0.md and docs/auth.md before
# exposing this): since v1.1 every route except /health, the OpenAPI
# doc and the login endpoints needs a Bearer session token — there is
# no default password; create the first admin with
# `df-server users create-admin` (see docs/self-hosting.md). This
# stack binds both services to the host's ports for local use only —
# put it behind a VPN / reverse proxy with auth, never on the open
# internet.
#   * Copy `.env.example` to `.env` and replace every value first.
#     Never commit a real `.env`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-decorpos}
    # Bound to loopback only: nothing in this stack connects to it
    # yet (the `hq` service is not in this file); keep it off the
    # LAN until you run `df-server hq` against it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  edge:
    build: .
    command:
      - df-server
      - edge
      - --db
      - sqlite:/data/edge.db
      - --store-id
      - ${STORE_ID:?set STORE_ID in .env}
      - --org-id
      - ${ORG_ID:?set ORG_ID in .env}
      - --store-name
      - ${STORE_NAME:-Decor POS Store}
      - --currency
      - ${CURRENCY:-CAD}
      - --country
      - ${COUNTRY:-}
      - --region
      - ${REGION:-}
      - --listen
      - 0.0.0.0:8080
    environment:
      # Stripe Terminal credentials are env-only, never in the image.
      # Leave unset for the mock terminal (dev/demo). Live Stripe
      # Terminal calls are not implemented in v1.0.
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_TERMINAL_LOCATION_ID: ${STRIPE_TERMINAL_LOCATION_ID:-}
      # Path to a typst binary for monthly-statement PDFs (the image
      # does not bundle typst — mount one or run `statements` on the
      # host). Leave unset to skip PDF rendering.
      DF_TYPST_BIN: ${DF_TYPST_BIN:-}
    ports:
      - "8080:8080"
    volumes:
      - edgedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  api:
    build: .
    command:
      - df-api
      - --db
      - sqlite:/data/edge.db
      - --org-id
      - ${ORG_ID:?set ORG_ID in .env}
      - --store-id
      - ${STORE_ID:?set STORE_ID in .env}
      - --listen
      - 0.0.0.0:3000
    # Same SQLite file as the edge (read/write pool, no migrations).
    # SQLite serializes the two processes; admin reads are light.
    ports:
      - "3000:3000"
    volumes:
      - edgedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      edge:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  edgedata:
