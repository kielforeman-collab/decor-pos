name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: groundbox-4vcpu
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: No floating-point money
        # Zero floating-point money (spec §8): f32/f64 must not appear in
        # the financial crates' sources. Fails the build if it does.
        run: |
          if grep -rnE '\bf(32|64)\b' crates/df-domain/src crates/df-db/src crates/df-auth/src; then
            echo "ERROR: f32/f64 found in a financial crate — money paths must use rust_decimal::Decimal"
            exit 1
          fi

      - name: Install Typst 0.15.1
        # df-jobs renders real statement PDFs via Typst (see
        # crates/df-reports/src/statement.rs); the runner has no
        # typst binary, so install the same version verified locally.
        run: |
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Tests (nextest)
        run: cargo nextest run --workspace

      - name: Doc tests
        run: cargo test --workspace --doc
