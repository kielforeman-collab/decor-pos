name: Release

# Builds installer downloads on every version tag (v*):
#  - Windows: Decor POS desktop installer (.msi + NSIS .exe) + df-server binary
#  - Linux:   Decor POS desktop installer (.rpm + .AppImage) + df-server binary
# Linux + publish run on Groundbox runners; Windows runs on GitHub-hosted
# windows-latest (free for public repos, with full VS 2022 MSVC, Windows SDK,
# NSIS, WiX, and Git Bash — Groundbox Windows defaulted rustup to -gnu without
# dlltool.exe in run 46111316618). Each build job uploads its files as a run
# artifact; the publish job (tag runs only) attaches them to the GitHub
# release for the tag, so two jobs never race creating the release.
# Manual runs (workflow_dispatch) build everything and stop at artifacts —
# no release is created — which is how the pipeline is tested.
#
# Note: a tag points at a main commit, and the CI check job runs on every
# push to main, so the tagged code has already passed tests + clippy + fmt.
# The release jobs do not re-run the suite.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build (manual test runs only)"
        type: choice
        default: all
        options:
          - all
          - linux
          - windows

permissions:
  contents: write

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/pos-desktop/package-lock.json

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        working-directory: apps/pos-desktop
        run: npm ci

      - name: Generate app icons
        # The icon source is a text SVG (icons/icon.svg, same mark as the
        # PWA icon); the binary icon set is generated here, never committed.
        working-directory: apps/pos-desktop/src-tauri
        run: cargo tauri icon icons/icon.svg

      - name: Build desktop installers
        # --features tauri-shell: the plain build prints a message and
        # exits 2 without the shell feature (see the tauri_windows_build
        # skill). Bundles: NSIS .exe + WiX .msi.
        working-directory: apps/pos-desktop
        run: cargo tauri build --features tauri-shell --bundles nsis,msi

      - name: Build server binary
        run: cargo build --release -p df-server

      - name: Stage artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          Copy-Item target/release/bundle/nsis/*.exe dist-release/
          Copy-Item target/release/bundle/msi/*.msi dist-release/
          Copy-Item target/release/df-server.exe "dist-release/df-server-${{ github.ref_name }}-windows-x86_64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decor-pos-windows
          path: dist-release/*
          if-no-files-found: error

  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: groundbox-4vcpu
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/pos-desktop/package-lock.json

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        working-directory: apps/pos-desktop
        run: npm ci

      - name: Generate app icons
        working-directory: apps/pos-desktop/src-tauri
        run: cargo tauri icon icons/icon.svg

      - name: Build desktop installers
        working-directory: apps/pos-desktop
        run: cargo tauri build --features tauri-shell --bundles rpm,appimage

      - name: Build server binary
        run: cargo build --release -p df-server

      - name: Stage artifacts
        run: |
          mkdir -p dist-release
          cp target/release/bundle/rpm/*.rpm dist-release/
          cp target/release/bundle/appimage/*.AppImage dist-release/
          cp target/release/df-server "dist-release/df-server-${{ github.ref_name }}-linux-x86_64"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decor-pos-linux
          path: dist-release/*
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: groundbox-4vcpu
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decor-pos-windows
          path: release-assets/windows

      - uses: actions/download-artifact@v4
        with:
          name: decor-pos-linux
          path: release-assets/linux

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*
            release-assets/linux/*
          generate_release_notes: true
