[workspace]
resolver = "2"
members = [
    "crates/df-ar",
    "crates/df-domain",
    "crates/df-db",
    "crates/df-auth",
    "crates/df-api",
    "crates/df-sync",
    "crates/df-edge",
    "crates/df-hw",
    "crates/df-tinter",
    "crates/df-payments",
    "crates/df-portal",
    "crates/df-edi",
    "crates/df-plugin-sdk",
    "crates/df-jobs",
    "crates/df-reports",
    "crates/df-accounting",
    "crates/df-server",
    "crates/df-crm",
    "crates/df-delivery",
    "crates/df-scheduling",
    "crates/df-migrator",
    "apps/pos-desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
authors = ["decor-pos contributors"]
repository = "https://example.invalid/decor-pos"
homepage = "https://example.invalid/decor-pos"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["json", "macros", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
df-ar = { path = "crates/df-ar" }
df-auth = { path = "crates/df-auth" }
df-crm = { path = "crates/df-crm" }
df-delivery = { path = "crates/df-delivery" }
df-accounting = { path = "crates/df-accounting" }
df-db = { path = "crates/df-db" }
df-domain = { path = "crates/df-domain" }
df-edge = { path = "crates/df-edge" }
df-edi = { path = "crates/df-edi" }
df-hw = { path = "crates/df-hw" }
df-jobs = { path = "crates/df-jobs" }
df-payments = { path = "crates/df-payments" }
df-portal = { path = "crates/df-portal" }
df-scheduling = { path = "crates/df-scheduling" }
df-migrator = { path = "crates/df-migrator" }
df-plugin-sdk = { path = "crates/df-plugin-sdk" }
df-reports = { path = "crates/df-reports" }
df-sync = { path = "crates/df-sync" }
df-tinter = { path = "crates/df-tinter" }
proptest = "1"
rand = "0.9"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "sqlite", "runtime-tokio", "rust_decimal", "uuid", "chrono", "migrate", "macros", "any"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
utoipa = { version = "5", features = ["axum_extras"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.dev]
debug = true
