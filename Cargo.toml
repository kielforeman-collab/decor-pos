[workspace]
resolver = "2"
members = [
    "crates/df-domain",
    "crates/df-db",
    "crates/df-auth",
    "crates/df-api",
    "crates/df-sync",
    "crates/df-edge",
    "crates/df-hw",
    "crates/df-tinter",
    "crates/df-payments",
    "crates/df-edi",
    "crates/df-plugin-sdk",
    "crates/df-jobs",
    "crates/df-reports",
    "crates/df-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
authors = ["decor-pos contributors"]
repository = "https://example.invalid/decor-pos"
homepage = "https://example.invalid/decor-pos"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["json", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
df-auth = { path = "crates/df-auth" }
df-db = { path = "crates/df-db" }
df-domain = { path = "crates/df-domain" }
proptest = "1"
rand = "0.9"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "sqlite", "runtime-tokio", "rust_decimal", "uuid", "chrono", "migrate", "macros", "any"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
utoipa = { version = "5", features = ["axum_extras"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.dev]
debug = true
